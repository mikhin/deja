name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm deadcode
      - run: pnpm dead-files
      - run: pnpm dead-mocks
      - run: pnpm dup

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: changed
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          files=$(node scripts/changed-mutants.mjs "$BASE_REF")
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Mutating: ${files:-nothing in the mutate globs}"
      - if: steps.changed.outputs.files != ''
        run: pnpm mutation --mutate "${{ steps.changed.outputs.files }}" --reporters json
      - if: steps.changed.outputs.files != ''
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/mutation-pr-report.mjs "$BASE_REF" > comment.md
      - if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- mutation-report -->"))) | first | .id // empty')
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@comment.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
